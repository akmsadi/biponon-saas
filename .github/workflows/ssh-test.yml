# Trial: can GitHub's servers log in to the cPanel server over SSH? Run it by hand from the
# Actions tab. It only connects and runs harmless commands. Delete this file once auto deploy
# over SSH is in place (see docs/DEPLOYMENT.md).
name: SSH test

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to the server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Only the server's own key is trusted (no "accept anything" switch).
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            'echo "user: $(whoami)"; echo "home: $HOME"; echo "uapi: $(command -v uapi || echo MISSING)"; cd ~/biponon && echo "production at: $(git log -1 --format="%h %s")"'
